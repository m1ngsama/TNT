name: CI

on:
  pull_request:
    branches: [ main, 'release/**' ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR gate (${{ matrix.os }})
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cpio expect fish libssh-dev mandoc ruby zsh

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install libssh coreutils fish

    - name: Build with AddressSanitizer
      run: make asan

    - name: Run UndefinedBehaviorSanitizer gate
      if: runner.os == 'Linux'
      run: make ubsan-test PORT=13680

    - name: Run comprehensive tests (macOS)
      if: runner.os == 'macOS'
      run: |
        make ci-test
        make clean
        make
        ./tnt --version
        ./tntctl --version

    - name: Run release and runtime gates (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        make release-check
        make integration-test PORT=13700
        make anonymous-access-test PORT=13720
        make connection-limit-test PORT=13730
        make security-test PORT=13740

  main-smoke:
    name: main smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cpio expect fish libssh-dev mandoc ruby zsh

    # A strict subset of the gate the pull request already passed: it exists to
    # catch what only a merge can introduce, so no check may live here alone.
    - name: Build and run the fast suites
      run: |
        make
        make unit-test
        make script-test

  musl-build:
    name: musl build (alpine)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6

    - name: Build against musl
      run: |
        docker run --rm -v "$PWD:/src:ro" alpine:3.20 sh -c '
          set -eu
          apk add --no-cache build-base libssh-dev ca-certificates
          mkdir /work
          cp -R /src/. /work/
          cd /work
          make clean
          make
          ./tnt --version
          ./tntctl --version
          make small
          ./tnt --version
          ./tntctl --version
        '
