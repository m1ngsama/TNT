name: Performance charter

on:
  workflow_dispatch:
    inputs:
      durability:
        description: Also run the long durability profile
        required: false
        type: boolean
        default: false
      durability_seconds:
        description: Durability seconds when enabled
        required: false
        default: '1800'
      retain_report:
        description: Retain JSON for review (failures are always retained)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: performance-charter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target-profile:
    name: 64-session core budget
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - name: Check out TNT
      uses: actions/checkout@v6
      with:
        path: tnt

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssh-dev

    - name: Run requested 64-session contract
      working-directory: tnt
      env:
        RUN_DURABILITY: ${{ inputs.durability }}
        REQUESTED_DURATION: ${{ inputs.durability_seconds }}
      run: |
        set -eu
        if [ "$RUN_DURABILITY" = "true" ]; then
          make perf-soak \
            PERF_DURABILITY_SECONDS="${REQUESTED_DURATION:-1800}" \
            PERF_OUTPUT="$RUNNER_TEMP/performance.json"
        else
          make perf-full PERF_OUTPUT="$RUNNER_TEMP/performance.json"
        fi

    - name: Preserve requested or failed evidence
      if: ${{ failure() || inputs.retain_report }}
      uses: actions/upload-artifact@v7
      with:
        name: performance-charter-${{ github.run_id }}
        path: ${{ runner.temp }}/performance.json
        if-no-files-found: warn
        retention-days: 3
